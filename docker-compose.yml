version: "3.8"

networks:
  public_proxy:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  app_exports:
  app_logs:

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: steam_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steam_intelligence
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steam_secure_password_default}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam -d steam_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: steam_intel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam_intel_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steam:${POSTGRES_PASSWORD:-steam_secure_password_default}@postgres:5432/steam_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - app_exports:/app/exports
      - app_logs:/app/logs
    networks:
      - public_proxy
      - internal
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam_intel_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=INFO -Q catalog,metadata,players_high_priority,players_standard,reviews,prices,rankings,analytics,ai,exports,maintenance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steam:${POSTGRES_PASSWORD:-steam_secure_password_default}@postgres:5432/steam_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - app_exports:/app/exports
      - app_logs:/app/logs
    networks:
      - internal

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam_intel_scheduler
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steam:${POSTGRES_PASSWORD:-steam_secure_password_default}@postgres:5432/steam_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam_intel_frontend
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    networks:
      - public_proxy
    ports:
      - "3000:3000"
